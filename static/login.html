<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/uikit.min.css" />
  <link rel="stylesheet" href="apper-auth.css" />
  <script src="js/uikit.min.js"></script>
  <script src="js/uikit-icons.min.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 36px 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="uk-text-center uk-margin-bottom">
        <h2 id="login-app-title" class="uk-heading-bullet uk-margin-remove" style="justify-content: center; display: inline-flex;">
          App Sign In
        </h2>
        <p class="uk-text-muted uk-text-small uk-margin-small-top">
          Sign in to access this application
        </p>
      </div>

      <div id="alert-container"></div>

      <div class="uk-margin-medium-top">
        <a href="/auth/login" class="google-btn" id="google-login-btn">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Sign in with Google
        </a>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    const email = urlParams.get('email');
    const msg = urlParams.get('msg');
    const alertContainer = document.getElementById('alert-container');

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    if (error === 'unauthorized_email') {
      alertContainer.innerHTML = `
        <div class="uk-alert-danger uk-margin-small-bottom" uk-alert>
          <a class="uk-alert-close" uk-close></a>
          <p class="uk-text-small">
            <strong>Access Denied:</strong> ${email ? '<code>' + escapeHtml(email) + '</code>' : 'Your email'} is not authorized to access this service.
          </p>
        </div>
      `;
    } else if (error === 'auth_failed') {
      alertContainer.innerHTML = `
        <div class="uk-alert-danger uk-margin-small-bottom" uk-alert>
          <a class="uk-alert-close" uk-close></a>
          <p class="uk-text-small">
            <strong>Authentication Failed:</strong> ${msg ? escapeHtml(msg) : 'Please try again.'}
          </p>
        </div>
      `;
    } else if (error === 'missing_code') {
      alertContainer.innerHTML = `
        <div class="uk-alert-warning uk-margin-small-bottom" uk-alert>
          <a class="uk-alert-close" uk-close></a>
          <p class="uk-text-small">No authorization code received from Google.</p>
        </div>
      `;
    }

    // Fetch auth config to customize title
    fetch('/auth/config')
      .then(res => res.json())
      .then(cfg => {
        if (cfg.appName) {
          document.title = `Sign In - ${cfg.appName}`;
          const titleEl = document.getElementById('login-app-title');
          if (titleEl) titleEl.textContent = cfg.appName;
        }
      })
      .catch(err => console.error('Failed to load auth config:', err));
  </script>
</body>
</html>
